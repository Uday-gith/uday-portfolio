name: Sync portfolio from Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync Drive portfolio
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          VIDEO_FOLDER_ID: ${{ secrets.VIDEO_FOLDER_ID }}
          GRAPHICS_FOLDER_ID: ${{ secrets.GRAPHICS_FOLDER_ID }}
          PERFORMANCE_FOLDER_ID: ${{ secrets.PERFORMANCE_FOLDER_ID }}
        run: node drive-sync.mjs

      - name: Commit portfolio data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.json assets/thumbs
          git diff --cached --quiet || git commit -m "Auto-sync portfolio from Drive"
          git push
